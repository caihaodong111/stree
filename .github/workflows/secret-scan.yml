name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "$base/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          expected="$(awk -v name="$archive" '$2 == name {print $1}' "$RUNNER_TEMP/gitleaks-checksums.txt")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete reachable history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner --log-opts=--all'
